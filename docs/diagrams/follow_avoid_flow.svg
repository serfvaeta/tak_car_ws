<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="600" y="45" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="36" fill="#172033">FOLLOW_AVOID 控制循环</text>
<rect x="70" y="140" width="280" height="120" rx="18" fill="#e0e7ff" stroke="#64748b" stroke-width="2"/>
<text x="210" y="178" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">ALIGN_TARGET</text>
<text x="210" y="224" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">每轮先按 AOA 转向</text>
<rect x="460" y="140" width="280" height="120" rx="18" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="600" y="178" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">FORWARD</text>
<text x="600" y="224" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">前进并持续测距</text>
<rect x="850" y="140" width="280" height="120" rx="18" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="990" y="178" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">SCAN_SIDE</text>
<text x="990" y="224" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">遇障停车，选可走方向</text>
<rect x="850" y="400" width="280" height="120" rx="18" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="990" y="438" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">TURN_OUT</text>
<text x="990" y="484" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">向可走方向转向</text>
<rect x="460" y="400" width="280" height="120" rx="18" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="600" y="438" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">ADVANCE</text>
<text x="600" y="484" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">低速绕行 150 mm</text>
<polyline points="350,200 460,200" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="460.0,200.0 447.9,207.0 447.9,193.0" fill="#475569"/>
<polyline points="740,200 850,200" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="850.0,200.0 837.9,207.0 837.9,193.0" fill="#475569"/>
<polyline points="990,260 990,400" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="990.0,400.0 983.0,387.9 997.0,387.9" fill="#475569"/>
<polyline points="850,460 740,460" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="740.0,460.0 752.1,453.0 752.1,467.0" fill="#475569"/>
<polyline points="460,460 210,460 210,260" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="210.0,260.0 217.0,272.1 203.0,272.1" fill="#475569"/>
<polyline points="600,140 600,105 210,105 210,140" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="210.0,140.0 203.0,127.9 217.0,127.9" fill="#475569"/>
<text x="405" y="175" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">对准后</text>
<text x="795" y="175" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">发现障碍</text>
<text x="1020" y="330" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">选路</text>
<text x="795" y="435" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">前方通畅</text>
<text x="330" y="488" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">绕行结束，再转向</text>
<text x="430" y="85" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">方向偏了，重新转向</text>
<text x="600" y="590" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="20" fill="#172033">转向阶段不避障；进入前进阶段后，先确认新的前向测距再行驶。</text>
</svg>