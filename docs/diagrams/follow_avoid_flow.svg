<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="500" y="45" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="34" fill="#172033">FOLLOW_AVOID 两次扇形检查与绕行</text>
<rect x="350" y="100" width="280" height="120" rx="18" fill="#e0e7ff" stroke="#64748b" stroke-width="2"/>
<text x="490" y="138" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">ALIGN_TARGET</text>
<text x="490" y="184" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">按 AOA 对准目标</text>
<rect x="350" y="235" width="280" height="120" rx="18" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="490" y="273" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">FORWARD</text>
<text x="490" y="319" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">跟随并持续探测</text>
<rect x="350" y="370" width="280" height="120" rx="18" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="490" y="408" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">粗扫筛选</text>
<text x="490" y="454" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">每 10°；中心 ±20° 五点达标</text>
<rect x="350" y="505" width="280" height="120" rx="18" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
<text x="490" y="543" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">细扫确认</text>
<text x="490" y="589" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">中心 ±12°，每 3° 九点达标</text>
<rect x="350" y="640" width="280" height="120" rx="18" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="490" y="678" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">实际转向角</text>
<text x="490" y="724" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">取已确认扇形的中心角</text>
<rect x="350" y="775" width="280" height="120" rx="18" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="490" y="813" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">ADVANCE</text>
<text x="490" y="859" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="18" fill="#172033">min(扇形最近测距, 2000) - 200 mm</text>
<rect x="40" y="505" width="280" height="120" rx="18" fill="#fee2e2" stroke="#64748b" stroke-width="2"/>
<text x="180" y="543" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="27" fill="#172033">RESCAN_WAIT</text>
<text x="180" y="589" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">停车 2 秒后重新粗扫</text>
<polyline points="490,220 490,235" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="490.0,235.0 483.0,222.9 497.0,222.9" fill="#475569"/>
