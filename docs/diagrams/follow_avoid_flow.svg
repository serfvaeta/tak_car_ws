<polygon points="490.0,505.0 483.0,492.9 497.0,492.9" fill="#475569"/>
<polyline points="490,625 490,640" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="490.0,640.0 483.0,627.9 497.0,627.9" fill="#475569"/>
<polyline points="490,760 490,775" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="490.0,775.0 483.0,762.9 497.0,762.9" fill="#475569"/>
<polyline points="490,895 900,895 900,75 490,75 490,100" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="490.0,100.0 483.0,87.9 497.0,87.9" fill="#475569"/>
<polyline points="350,430 300,430 300,565 320,565" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="320.0,565.0 307.9,572.0 307.9,558.0" fill="#475569"/>
<polyline points="350,565 320,565" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="320.0,565.0 332.1,558.0 332.1,572.0" fill="#475569"/>
<polyline points="350,700 300,700 300,565 320,565" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="320.0,565.0 307.9,572.0 307.9,558.0" fill="#475569"/>
<polyline points="320,565 280,565 280,430 350,430" fill="none" stroke="#475569" stroke-width="4"/>
<polygon points="350.0,430.0 337.9,437.0 337.9,423.0" fill="#475569"/>
<text x="770" y="225" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">对准后</text>
<text x="770" y="360" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">发现障碍</text>
<text x="770" y="495" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">找到粗扫候选</text>
<text x="790" y="630" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">九点全部达标</text>
<text x="790" y="765" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">正前方测距放行</text>
<text x="760" y="925" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="22" fill="#172033">绕行结束，重新对准</text>
<text x="180" y="650" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="17" fill="#172033">无合格路 / 超时 / 转向受阻</text>
<text x="500" y="970" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC" font-size="19" fill="#172033">细扫不合格则尝试下一粗扫候选；粗扫超时 9 秒，细扫超时 5 秒。</text>
</svg>
