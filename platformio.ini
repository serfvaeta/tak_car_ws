[env:openctr_h60_v32]
platform = ststm32
board = genericSTM32F407VET6
upload_protocol = stlink
debug_tool = stlink
debug_speed = 25
board_build.ldscript = ld/stm32f407ve_flash.ld
extra_scripts = pre:extra_scripts/hard_float.py
build_flags =
    -DSTM32F40_41xxx
    -DUSE_STDPERIPH_DRIVER
    -DHSE_VALUE=8000000
    -DOPENCTR_ENABLE_APP_CONTROL=1
    -DOPENCTR_ENABLE_PS2_CONTROL=1
    -DOPENCTR_ENABLE_SBUS_CONTROL=0
    -DOPENCTR_ENABLE_TTL_CONTROL=0
    -DOPENCTR_ENABLE_CAN_CONTROL=0
    -DOPENCTR_ENABLE_AOA_RECEIVER=1
    -DOPENCTR_FOLLOW_AZIMUTH_TO_YAW_SIGN=1
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16
    -Iinclude/config
    -Iinclude/vendor/cmsis
    -Iinclude/vendor/device
    -Iinclude/vendor/spl
    -Iinclude/vendor/freertos
    -Isrc/rtos/port
    -Isrc/app
    -Isrc/chassis
    -Isrc/control
    -Isrc/communication
    -Isrc/sensors
    -Isrc/actuators
    -Isrc/ui
    -Isrc/ui/oled
    -Isrc/system
    -Isrc/platform
